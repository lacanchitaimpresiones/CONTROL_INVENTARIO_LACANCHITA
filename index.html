<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Control Inventario | IMPRESIONES LA CANCHITA</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1jKOAkSEk-a2GQRk8yF_yHIoNlc4aasEP=s200-c">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1jKOAkSEk-a2GQRk8yF_yHIoNlc4aasEP=s200-c">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; color: #fff; }
    iframe { border: none; width: 100%; height: 100%; display: block; }
    #avisoMovil { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .btn { background: #f59e0b; color: #fff; font-weight: 800; padding: 14px 24px; border-radius: 14px; text-decoration: none; margin-top: 16px; display: inline-block; }
  </style>
</head>
<body>
  <div id="avisoMovil">
    <img src="https://lh3.googleusercontent.com/d/1jKOAkSEk-a2GQRk8yF_yHIoNlc4aasEP=s200-c" style="width:76px;height:76px;border-radius:50%;border:2px solid #f59e0b;margin-bottom:12px;">
    <h2 style="margin:0;font-size:18px;">CONTROL DE INVENTARIO</h2>
    <p style="font-size:13px;color:#cbd5e1;margin-top:6px;">Abriendo panel seguro...</p>
    <a id="linkDirecto" href="https://script.google.com/macros/s/AKfycbwzcbix-Fo2WQprQYZajsIxS-BPv4ix7S_iFBCwy5-i1yjLAxwd6slRurwac_n0fCor/exec" class="btn">Entrar ahora</a>
  </div>

  <iframe id="marcoApp" src="https://script.google.com/macros/s/AKfycbwzcbix-Fo2WQprQYZajsIxS-BPv4ix7S_iFBCwy5-i1yjLAxwd6slRurwac_n0fCor/exec" allow="camera"></iframe>

  <script>
    var urlApp = "https://script.google.com/macros/s/AKfycbwzcbix-Fo2WQprQYZajsIxS-BPv4ix7S_iFBCwy5-i1yjLAxwd6slRurwac_n0fCor/exec";
    var esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (esIOS) {
      document.getElementById('marcoApp').style.display = 'none';
      document.getElementById('avisoMovil').style.display = 'flex';
      window.location.replace(urlApp);
    }
  </script>
</body>
</html>
